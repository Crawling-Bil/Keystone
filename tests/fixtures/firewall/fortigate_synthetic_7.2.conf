#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890123456
#buildno=1517
#global_vdom=1
config system global
    set admin-concurrent disable
    set admin-console-timeout 0
    set admin-https-ssl-versions tlsv1-1 tlsv1-2 tlsv1-3
    set admin-sport 8443
    set admin-server-cert "Fortinet_Factory"
    set admintimeout 480
    set alias "FGT60F"
    set gui-theme mariner
    set hostname "FW-HQ-01"
    set strong-crypto disable
    set timezone 28
    set admin-telnet enable
    set admin-lockout-threshold 10
    set admin-lockout-duration 60
end
config system accprofile
    edit "prof_admin"
        set secfabgrp read-write
        set ftviewgrp read-write
        set authgrp read-write
        set sysgrp read-write
        set netgrp read-write
        set loggrp read-write
        set fwgrp read-write
        set vpngrp read-write
        set utmgrp read-write
        set wifi read-write
    next
    edit "audit_ro"
        set secfabgrp read
        set sysgrp read
        set netgrp read
        set loggrp read
        set fwgrp read
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.18.10.2 255.255.255.252
        set allowaccess ping https ssh http telnet
        set type physical
        set alias "ISP-A"
        set role wan
        set snmp-index 1
    next
    edit "wan2"
        set vdom "root"
        set mode dhcp
        set allowaccess ping fgfm
        set type physical
        set alias "ISP-B-LTE"
        set role wan
        set snmp-index 2
    next
    edit "lan"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh fgfm
        set type hard-switch
        set alias "CORP-LAN"
        set device-identification enable
        set role lan
        set snmp-index 3
    next
    edit "dmz"
        set vdom "root"
        set ip 172.16.50.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role dmz
        set snmp-index 4
    next
    edit "vlan100"
        set vdom "root"
        set ip 10.100.0.1 255.255.255.0
        set allowaccess ping https
        set device-identification enable
        set role lan
        set interface "lan"
        set vlanid 100
        set snmp-index 5
    next
    edit "HQ-DR-VPN"
        set vdom "root"
        set type tunnel
        set interface "wan1"
        set snmp-index 6
    next
end
config system zone
    edit "TRUSTED"
        set intrazone allow
        set interface "lan" "vlan100"
    next
end
config system password-policy
    set status enable
    set minimum-length 8
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz==
    next
    edit "netops"
        set trusthost1 10.10.0.0 255.255.255.0
        set accprofile "prof_admin"
        set vdom "root"
        set password ENC SH2zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz==
        set two-factor fortitoken
    next
    edit "auditor"
        set trusthost1 10.10.0.0 255.255.255.0
        set accprofile "audit_ro"
        set vdom "root"
        set password ENC SH2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy==
    next
end
config system ha
    set group-name "HQ-FW"
    set mode a-p
    set password ENC abcdefghijklmnopqrstuvwxyz
    set hbdev "ha" 50
    set session-pickup enable
    set override disable
    set priority 200
end
config system dns
    set primary 10.10.0.10
    set secondary 1.1.1.1
end
config system ntp
    set ntpsync disable
end
config system snmp sysinfo
    set status enable
    set contact-info "noc@example.invalid"
    set location "HQ"
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
        set query-v1-status enable
    next
end
config system snmp user
    edit "monitor"
        set security-level auth-priv
        set auth-proto md5
        set auth-pwd ENC xxxxxxxx
        set priv-proto des
        set priv-pwd ENC yyyyyyyy
    next
end
config system dhcp server
    edit 1
        set dns-service default
        set default-gateway 10.10.0.1
        set netmask 255.255.255.0
        set interface "lan"
        config ip-range
            edit 1
                set start-ip 10.10.0.100
                set end-ip 10.10.0.199
            next
        end
    next
end
config system auto-install
    set auto-install-config enable
    set auto-install-image enable
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set gateway 198.18.10.1
        next
        edit 2
            set interface "wan2"
            set gateway 198.18.20.1
            set cost 10
        next
    end
    config health-check
        edit "Default_DNS"
            set server "8.8.8.8"
            set members 1 2
        next
        edit "Google_Search"
            set server "www.google.com"
            set protocol http
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 200
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
    end
    config service
        edit 1
            set name "Teams-via-ISP-A"
            set mode priority
            set internet-service enable
            set internet-service-name "Microsoft-Teams"
            set health-check "Google_Search"
            set priority-members 1 2
        next
    end
end
config router static
    edit 1
        set gateway 198.18.10.1
        set device "wan1"
        set comment "default via ISP-A"
    next
    edit 2
        set dst 192.168.99.0 255.255.255.0
        set blackhole enable
    next
    edit 3
        set dst 10.200.0.0 255.255.0.0
        set gateway 10.10.0.254
        set device "lan"
        set status disable
    next
end
config router bgp
    set as 65010
    set router-id 10.255.255.1
    config neighbor
        edit "198.18.10.1"
            set remote-as 64512
            set soft-reconfiguration enable
        next
        edit "10.10.0.254"
            set remote-as 65010
            set password ENC bgp-secret-blob
            set route-map-in "RM-IN"
            set prefix-list-out "PL-OUT"
        next
    end
    config network
        edit 1
            set prefix 10.10.0.0 255.255.255.0
        next
    end
end
config router ospf
    set router-id 10.255.255.1
    config area
        edit 0.0.0.0
        next
    end
    config ospf-interface
        edit "lan-ospf"
            set interface "lan"
            set authentication none
        next
    end
    config network
        edit 1
            set prefix 10.10.0.0 255.255.255.0
            set area 0.0.0.0
        next
    end
end
config firewall address
    edit "all"
    next
    edit "LAN-NET"
        set subnet 10.10.0.0 255.255.255.0
    next
    edit "VLAN100-NET"
        set subnet 10.100.0.0 255.255.255.0
    next
    edit "WEB-SRV"
        set subnet 172.16.50.10 255.255.255.255
    next
    edit "DC-SRV"
        set subnet 10.10.0.10 255.255.255.255
    next
    edit "UNUSED-HOST"
        set subnet 10.10.0.77 255.255.255.255
    next
    edit "VENDOR-FQDN"
        set type fqdn
        set fqdn "support.vendor.example"
    next
    edit "BRANCH-RANGE"
        set type iprange
        set start-ip 10.30.0.10
        set end-ip 10.30.0.50
    next
end
config firewall addrgrp
    edit "CORP-NETS"
        set member "LAN-NET" "VLAN100-NET"
    next
end
config firewall service custom
    edit "APP-8080"
        set tcp-portrange 8080
    next
    edit "RDP-ALT"
        set tcp-portrange 3390
    next
end
config firewall service group
    edit "WEB-SERVICES"
        set member "HTTP" "HTTPS" "APP-8080"
    next
end
config firewall vip
    edit "VIP-WEB"
        set extip 198.18.10.2
        set extintf "wan1"
        set portforward enable
        set mappedip "172.16.50.10"
        set protocol tcp
        set extport 443
        set mappedport 443
    next
    edit "VIP-ALLPORTS"
        set extip 198.18.10.3
        set extintf "any"
        set mappedip "172.16.50.20"
    next
end
config firewall ippool
    edit "SNAT-POOL"
        set startip 198.18.10.4
        set endip 198.18.10.4
    next
end
config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "CORP-NETS"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set webfilter-profile "default"
        set ips-sensor "default"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "WAN-to-DMZ-web"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-WEB"
        set schedule "always"
        set service "HTTPS"
        set logtraffic utm
    next
    edit 3
        set name "ANY-ANY"
        set srcintf "any"
        set dstintf "any"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 4
        set name "LAN-to-DMZ-shadowed"
        set srcintf "lan"
        set dstintf "dmz"
        set action accept
        set srcaddr "LAN-NET"
        set dstaddr "WEB-SRV"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 5
        set name "OLD-RULE"
        set status disable
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN-NET"
        set dstaddr "VENDOR-FQDN"
        set schedule "always"
        set service "RDP-ALT"
        set logtraffic all
    next
    edit 6
        set name "WAN-to-VIP-ALLPORTS"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-ALLPORTS"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 7
        set name "WAN-to-LAN-RDP"
        set srcintf "wan1"
        set dstintf "lan"
        set action accept
        set srcaddr "all"
        set dstaddr "DC-SRV"
        set schedule "always"
        set service "RDP"
        set logtraffic all
    next
end
config vpn ipsec phase1-interface
    edit "HQ-DR-VPN"
        set interface "wan1"
        set ike-version 1
        set mode aggressive
        set peertype any
        set net-device disable
        set proposal 3des-md5 aes128-sha1
        set dhgrp 2 5
        set remote-gw 198.18.30.2
        set psksecret ENC pskblobpskblobpskblob
        set dpd disable
        set keylife 86400
    next
    edit "BRANCH-ADVPN"
        set type dynamic
        set interface "wan1"
        set ike-version 2
        set proposal aes256-sha256
        set dhgrp 21
        set authmethod signature
        set certificate "Fortinet_Factory"
    next
end
config vpn ipsec phase2-interface
    edit "HQ-DR-VPN-P2"
        set phase1name "HQ-DR-VPN"
        set proposal 3des-sha1 aes128-sha1
        set pfs disable
        set src-subnet 10.10.0.0 255.255.255.0
        set dst-subnet 10.20.0.0 255.255.255.0
    next
end
config vpn ssl settings
    set ssl-min-proto-ver tls1-1
    set servercert "Fortinet_Factory"
    set source-interface "wan1"
    set port 10443
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set default-portal "full-access"
    config authentication-rule
        edit 1
            set groups "SSLVPN-USERS"
            set portal "full-access"
        next
    end
end
config user ldap
    edit "AD-LDAP"
        set server "10.10.0.10"
        set cnid "sAMAccountName"
        set dn "dc=corp,dc=example,dc=invalid"
        set type regular
        set username "cn=svc-fw,ou=svc,dc=corp,dc=example,dc=invalid"
        set password ENC ldapsecretblob
        set secure disable
        set port 389
    next
end
config user group
    edit "SSLVPN-USERS"
        set member "AD-LDAP"
    next
end
config log syslogd setting
    set status disable
end
config log fortianalyzer setting
    set status disable
end
config log memory setting
    set status enable
end
config log eventfilter
    set event enable
end
