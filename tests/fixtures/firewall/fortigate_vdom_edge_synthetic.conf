#config-version=FG110E-7.4.7-FW-build2731-241001:opmode=1:vdom=1:user=admin
#global_vdom=1
config vdom
edit root
next
edit DMZ-FG
next
edit WAN-FG
config system settings
    set opmode transparent
end
next
end
config global
config system global
    set hostname "FW-EDGE-01"
end
config system ha
    set mode a-p
end
config system interface
    edit "port1"
        set vdom "root"
        set type physical
        set speed 10000full
    next
    edit "port2"
        set vdom "root"
        set type physical
        set speed 10000full
    next
    edit "agg-core"
        set vdom "root"
        set type aggregate
        set member "port1" "port2"
        set alias "to SW-EDGE-1 - Eth1/39"
    next
    edit "agg-core.100"
        set vdom "DMZ-FG"
        set ip 192.0.2.1 255.255.255.252
        set type vlan
        set interface "agg-core"
        set vlanid 100
        set alias "DMZ uplink"
    next
    edit "port3"
        set vdom "DMZ-FG"
        set ip 198.51.100.2 255.255.255.0
        set type physical
        set alias "to RTR-WAN-1 - Gi0/0/1"
    next
    edit "mgmt"
        set vdom "root"
        set ip 10.9.9.2 255.255.255.0
        set type physical
    next
end
end
config vdom
edit DMZ-FG
config router static
    edit 1
        set gateway 198.51.100.1
        set device "port3"
    next
    edit 2
        set dst 10.50.0.0 255.255.0.0
        set gateway 192.0.2.2
        set device "agg-core.100"
    next
end
next
edit WAN-FG
config router static
    edit 1
        set gateway 10.9.9.1
        set device "mgmt"
    next
end
next
end
