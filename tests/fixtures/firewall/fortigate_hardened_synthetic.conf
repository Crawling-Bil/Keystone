#config-version=FGT60F-7.4.8-FW-build2795-250901:opmode=0:vdom=0:user=admin
config system global
    set hostname "FW-CLEAN-01"
    set admintimeout 10
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
    set strong-crypto enable
    set private-data-encryption enable
    set admin-server-cert "corp-gui-cert"
    set admin-lockout-threshold 3
    set timezone 28
end
config system password-policy
    set status enable
    set minimum-length 14
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.18.10.2 255.255.255.252
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "lan"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type hard-switch
        set role lan
    next
end
config system admin
    edit "netops"
        set trusthost1 10.10.0.0 255.255.255.0
        set accprofile "super_admin"
        set vdom "root"
        set two-factor fortitoken
        set password ENC SH2cleancleancleancleancleancleancleanclean==
    next
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "ntp1.example.invalid"
        next
        edit 2
            set server "ntp2.example.invalid"
        next
    end
end
config log syslogd setting
    set status enable
    set server "10.10.0.50"
    set mode reliable
end
config system snmp user
    edit "mon"
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd ENC aaaaaaaa
        set priv-proto aes256
        set priv-pwd ENC bbbbbbbb
        config hosts
            edit 1
                set ip 10.10.0.60 255.255.255.255
            next
        end
    next
end
config firewall address
    edit "LAN-NET"
        set subnet 10.10.0.0 255.255.255.0
    next
    edit "WEB-SRV"
        set subnet 10.10.0.20 255.255.255.255
    next
end
config firewall vip
    edit "VIP-WEB"
        set extip 198.18.10.2
        set extintf "wan1"
        set portforward enable
        set mappedip "10.10.0.20"
        set protocol tcp
        set extport 443
        set mappedport 443
    next
end
config firewall DoS-policy
    edit 1
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        config anomaly
            edit "tcp_syn_flood"
                set status enable
            next
        end
    next
end
config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN-NET"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "WAN-to-WEB"
        set srcintf "wan1"
        set dstintf "lan"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-WEB"
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set av-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next
end
