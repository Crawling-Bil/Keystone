#config-version=FGT100F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=1000000000
#buildno=1517
config system global
    set hostname "FW-SYN-01"
    set timezone 80
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "to ISP"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh fgfm
        set type physical
        set alias "LAN"
        set role lan
    next
    edit "port3"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "DMZ"
        set role dmz
    next
    edit "port4"
        set vdom "root"
        set type physical
    next
    edit "port5"
        set vdom "root"
        set type physical
    next
    edit "mgmt"
        set vdom "root"
        set ip 192.0.2.10 255.255.255.0
        set allowaccess ping https ssh
        set type physical
    next
    edit "vlan30"
        set vdom "root"
        set ip 10.30.0.1 255.255.255.0
        set allowaccess ping
        set interface "port2"
        set vlanid 30
    next
    edit "agg1"
        set vdom "root"
        set ip 10.40.0.1 255.255.255.0
        set type aggregate
        set member "port4" "port5"
        set lacp-mode active
    next
    edit "lo0"
        set vdom "root"
        set ip 10.255.0.1 255.255.255.255
        set type loopback
    next
    edit "to-branch"
        set vdom "root"
        set type tunnel
        set interface "wan1"
    next
    edit "to-dr"
        set vdom "root"
        set type tunnel
        set interface "wan1"
    next
end
config system zone
    edit "INSIDE"
        set interface "port2" "vlan30"
    next
end
config system settings
    set central-nat disable
end
config firewall address
    edit "LAN-NET"
        set subnet 10.10.0.0 255.255.255.0
        set comment "office LAN"
    next
    edit "WEB-SRV"
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "PARTNER-NET"
        set subnet 10.60.0.0 255.255.0.0
    next
    edit "RANGE-A"
        set type iprange
        set start-ip 10.20.0.100
        set end-ip 10.20.0.120
    next
    edit "UPDATE-FQDN"
        set type fqdn
        set fqdn "updates.example.test"
    next
    edit "GEO-BLOCK"
        set type geography
        set country "KP"
    next
    edit "MAC-HOST"
        set type mac
        set macaddr "00:11:22:33:44:55"
    next
end
config firewall addrgrp
    edit "INTERNAL"
        set member "LAN-NET" "WEB-SRV"
    next
end
config firewall service custom
    edit "WEB-ALT"
        set tcp-portrange 8080 8443
    next
    edit "DUAL"
        set tcp-portrange 5000
        set udp-portrange 5001
    next
    edit "APP-SRC"
        set tcp-portrange 9000:1024-65535
    next
end
config firewall service group
    edit "WEB-GROUP"
        set member "HTTP" "HTTPS" "WEB-ALT"
    next
end
config firewall ippool
    edit "POOL-OVL"
        set startip 203.0.113.10
        set endip 203.0.113.10
    next
    edit "POOL-1TO1"
        set type one-to-one
        set startip 203.0.113.40
        set endip 203.0.113.49
    next
end
config firewall vip
    edit "WEB-VIP"
        set extip 203.0.113.20
        set extintf "wan1"
        set portforward enable
        set mappedip "10.20.0.10"
        set protocol tcp
        set extport 443
        set mappedport 8443
    next
end
config firewall policy
    edit 1
        set name "To-partner"
        set srcintf "INSIDE"
        set dstintf "wan1"
        set srcaddr "LAN-NET"
        set dstaddr "PARTNER-NET"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "LAN-to-WAN"
        set srcintf "INSIDE"
        set dstintf "wan1"
        set srcaddr "INTERNAL"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "WEB-GROUP" "DNS" "PING"
        set logtraffic all
        set nat enable
    next
    edit 3
        set name "WAN-to-WEB"
        set srcintf "wan1"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "WEB-VIP"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set webfilter-profile "default"
        set logtraffic utm
    next
    edit 4
        set name "Block-geo"
        set srcintf "wan1"
        set dstintf "INSIDE"
        set srcaddr "GEO-BLOCK"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 5
        set name "Office-hours"
        set srcintf "INSIDE"
        set dstintf "port3"
        set srcaddr "LAN-NET"
        set dstaddr "WEB-SRV"
        set action accept
        set schedule "workhours"
        set service "DUAL" "APP-SRC"
        set logtraffic all
    next
    edit 6
        set name "VPN-in"
        set srcintf "to-branch"
        set dstintf "INSIDE"
        set srcaddr "all"
        set dstaddr "LAN-NET"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 7
        set name "DMZ-out-pool"
        set srcintf "port3"
        set dstintf "wan1"
        set srcaddr "WEB-SRV"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "NTP"
        set nat enable
        set ippool enable
        set poolname "POOL-OVL"
    next
    edit 8
        set name "Admins"
        set srcintf "INSIDE"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "WEB-SRV"
        set action accept
        set schedule "always"
        set service "SSH" "RDP"
        set groups "NetAdmins"
        set status disable
    next
end
config firewall policy6
    edit 1
        set name "v6-any"
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "wan1"
    next
    edit 2
        set dst 10.50.0.0 255.255.0.0
        set device "to-branch"
        set distance 20
        set priority 5
        set comment "branch"
    next
    edit 3
        set dst 192.0.2.0 255.255.255.0
        set blackhole enable
    next
    edit 4
        set dst 10.99.0.0 255.255.0.0
        set gateway 10.10.0.254
        set device "port2"
        set status disable
    next
end
config router bgp
    set as 65010
    set router-id 10.255.0.1
    config neighbor
        edit "203.0.113.1"
            set remote-as 64512
            set description "ISP"
        next
    end
    config network
        edit 1
            set prefix 10.10.0.0 255.255.255.0
        next
    end
    config redistribute "connected"
        set status enable
    end
end
config router ospf
    set router-id 10.255.0.1
    config area
        edit 0.0.0.0
        next
    end
    config network
        edit 1
            set prefix 10.40.0.0 255.255.255.0
            set area 0.0.0.0
        next
    end
end
config vpn ipsec phase1-interface
    edit "to-branch"
        set interface "wan1"
        set ike-version 2
        set proposal aes256-sha256 aes128-sha1
        set dhgrp 14 5
        set remote-gw 198.51.100.2
        set psksecret ENC AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        set keylife 28800
    next
    edit "to-dr"
        set interface "wan1"
        set mode aggressive
        set proposal 3des-md5
        set dhgrp 2
        set remote-gw 198.51.100.9
        set psksecret ENC BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    next
end
config vpn ipsec phase2-interface
    edit "to-branch-p2"
        set phase1name "to-branch"
        set proposal aes256-sha256
        set pfs enable
        set dhgrp 14
        set keylifeseconds 3600
        set src-subnet 10.10.0.0 255.255.255.0
        set dst-subnet 10.50.0.0 255.255.0.0
    next
    edit "to-branch-p2b"
        set phase1name "to-branch"
        set proposal aes256-sha256
        set src-addr-type name
        set dst-addr-type name
        set src-name "LAN-NET"
        set dst-name "PARTNER-NET"
    next
    edit "to-dr-p2"
        set phase1name "to-dr"
        set proposal 3des-md5
        set pfs disable
    next
end
