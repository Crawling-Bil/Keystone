#config-version=FG100F-7.0.12-FW-build0523-230711:opmode=0:vdom=1:user=admin
#conf_file_ver=2222222222222222
#buildno=0523
#global_vdom=1
config vdom
edit root
next
edit CORP
next
edit GUEST
next
end
config global
config system global
    set hostname "FW-DC-02"
    set admintimeout 10
    set strong-crypto enable
    set private-data-encryption enable
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.0.2 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
    edit "port2"
        set vdom "CORP"
        set ip 10.1.0.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role lan
    next
    edit "port3"
        set vdom "GUEST"
        set ip 172.20.0.1 255.255.255.0
        set type physical
        set role lan
    next
end
config system admin
    edit "ops"
        set accprofile "super_admin"
        set vdom "root" "CORP" "GUEST"
        set trusthost1 10.0.0.0 255.255.255.0
        set two-factor fortitoken
        set password ENC SH2opsopsopsopsopsopsopsopsopsopsopsopsopsops==
    next
end
config system ha
    set mode standalone
end
end
config vdom
edit root
config system settings
    set opmode nat
end
config firewall address
    edit "MGMT-NET"
        set subnet 10.0.0.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "mgmt-out"
        set srcintf "port1"
        set dstintf "port1"
        set action accept
        set srcaddr "MGMT-NET"
        set dstaddr "MGMT-NET"
        set schedule "always"
        set service "HTTPS" "SSH"
        set logtraffic all
        set av-profile "default"
    next
end
next
edit CORP
config system settings
    set opmode nat
    set inspection-mode proxy
end
config firewall address
    edit "CORP-NET"
        set subnet 10.1.0.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "corp-any"
        set srcintf "port2"
        set dstintf "port2"
        set action accept
        set srcaddr "CORP-NET"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "corp-deny-guest"
        set srcintf "port2"
        set dstintf "port2"
        set srcaddr "CORP-NET"
        set dstaddr "CORP-NET"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
next
edit GUEST
config firewall policy
    edit 1
        set name "guest-web"
        set srcintf "port3"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set logtraffic all
        set av-profile "default"
    next
end
next
end
