#TMSH-VERSION: 16.1.4.1
# SYNTHETIC configuration written from F5's documented TMSH syntax for unit tests - not exported from a real device.
# It follows the hardening advice the analyzer checks, so it should produce only informational or low findings.

auth ldap /Common/corp-ldap {
    bind-dn "cn=svc-f5,ou=svc,dc=corp,dc=example,dc=com"
    bind-pw $M$xy$syntheticvalue==
    port 636
    search-base-dn "dc=corp,dc=example,dc=com"
    servers { 10.20.0.5 10.20.0.6 }
    ssl enabled
    ssl-ca-cert-file /Common/corp-ca.crt
    ssl-check-peer enabled
}
auth password-policy {
    max-login-failures 5
    minimum-length 12
    password-memory 6
    policy-enforcement enabled
    required-lowercase 1
    required-numeric 1
    required-special 1
    required-uppercase 1
}
auth source {
    fallback true
    type ldap
}
auth user admin {
    description "Break-glass administrator"
    encrypted-password $6$synthetic$hashvalue
    partition-access {
        all-partitions {
            role admin
        }
    }
    shell tmsh
}
cm device /Common/lb-dc-01.corp.example.com {
    configsync-ip 10.10.99.1
    failover-state active
    hostname lb-dc-01.corp.example.com
    marketing-name "BIG-IP i10800"
    mirror-ip 10.10.98.1
    mirror-secondary-ip 10.10.99.1
    platform-id C123
    self-device true
    unicast-address {
        {
            effective-ip 10.10.99.1
            effective-port 1026
            ip 10.10.99.1
            port 1026
        }
        {
            effective-ip management-ip
            effective-port 1026
            ip management-ip
            port 1026
        }
    }
    version 16.1.4.1
}
cm device /Common/lb-dc-02.corp.example.com {
    configsync-ip 10.10.99.2
    failover-state standby
    hostname lb-dc-02.corp.example.com
    marketing-name "BIG-IP i10800"
    mirror-ip 10.10.98.2
    mirror-secondary-ip 10.10.99.2
    platform-id C123
    unicast-address {
        {
            effective-ip 10.10.99.2
            effective-port 1026
            ip 10.10.99.2
            port 1026
        }
        {
            effective-ip management-ip
            effective-port 1026
            ip management-ip
            port 1026
        }
    }
    version 16.1.4.1
}
cm device-group /Common/dg_ha {
    auto-sync enabled
    devices {
        lb-dc-01.corp.example.com { }
        lb-dc-02.corp.example.com { }
    }
    network-failover enabled
    type sync-failover
}
cm traffic-group /Common/traffic-group-1 {
    unit-id 1
}
ltm monitor http /Common/mon_http_app {
    defaults-from /Common/http
    destination *:*
    interval 5
    recv "HTTP/1.1 200 OK"
    send "GET /health HTTP/1.1\r\nHost: shop.example.com\r\nConnection: close\r\n\r\n"
    timeout 16
}
ltm monitor https /Common/mon_https_app {
    defaults-from /Common/https
    destination *:*
    interval 5
    recv "\"status\":\"UP\""
    send "GET /actuator/health HTTP/1.1\r\nHost: shop.example.com\r\nConnection: close\r\n\r\n"
    timeout 16
}
ltm node /Common/10.10.30.11 {
    address 10.10.30.11
}
ltm node /Common/10.10.30.12 {
    address 10.10.30.12
}
ltm persistence cookie /Common/cookie_shop {
    app-service none
    defaults-from /Common/cookie
}
ltm policy /Common/policy_http_redirect {
    controls { forwarding }
    requires { http }
    rules {
        to_https {
            actions {
                0 {
                    http-redirect
                    location "tcl:https://[HTTP::host][HTTP::uri]"
                    code 301
                }
            }
        }
    }
    strategy /Common/first-match
}
ltm policy /Common/policy_waf {
    controls { asm }
    requires { http }
    rules {
        asm_all {
            actions {
                0 {
                    asm
                    enable
                    policy /Common/shop_waf_policy
                }
            }
        }
    }
    strategy /Common/first-match
}
ltm pool /Common/pool_shop {
    load-balancing-mode least-connections-member
    members {
        /Common/10.10.30.11:8443 {
            address 10.10.30.11
        }
        /Common/10.10.30.12:8443 {
            address 10.10.30.12
        }
    }
    monitor /Common/mon_https_app
    slow-ramp-time 30
}
ltm profile client-ssl /Common/clientssl_shop {
    app-service none
    cert-key-chain {
        shop {
            cert /Common/shop.example.com.crt
            chain /Common/corp-ca.crt
            key /Common/shop.example.com.key
        }
    }
    ciphers ECDHE+AES-GCM:ECDHE+CHACHA20:!SSLV3:!TLSV1:!TLSV1_1:!RC4:!3DES:!MD5
    defaults-from /Common/clientssl
    options { dont-insert-empty-fragments no-sslv3 no-tlsv1 no-tlsv1.1 }
    secure-renegotiation require
}
ltm profile http /Common/http_shop {
    app-service none
    defaults-from /Common/http
    encrypt-cookies { BIGipServer* }
    cookie-encryption-passphrase $M$ab$syntheticpassphrase==
    insert-xforwarded-for enabled
    server-agent-name web
}
ltm profile server-ssl /Common/serverssl_shop {
    app-service none
    ca-file /Common/corp-ca.crt
    defaults-from /Common/serverssl
    options { dont-insert-empty-fragments no-sslv3 no-tlsv1 no-tlsv1.1 }
    ciphers ECDHE+AES-GCM:!SSLV3:!TLSV1:!TLSV1_1:!RC4:!3DES
    peer-cert-mode require
    server-name shop.example.com
}
ltm rule /Common/rule_security_headers {
    when HTTP_RESPONSE {
        HTTP::header insert Strict-Transport-Security "max-age=31536000; includeSubDomains"
        HTTP::header remove Server
    }
}
ltm virtual /Common/vs_shop_443 {
    destination /Common/160.19.5.20:443
    ip-protocol tcp
    mask 255.255.255.255
    persist {
        /Common/cookie_shop {
            default yes
        }
    }
    policies {
        /Common/policy_waf { }
    }
    pool /Common/pool_shop
    profiles {
        /Common/clientssl_shop {
            context clientside
        }
        /Common/http_shop { }
        /Common/serverssl_shop {
            context serverside
        }
        /Common/tcp { }
    }
    rules {
        /Common/rule_security_headers
    }
    source 0.0.0.0/0
    source-address-translation {
        type automap
    }
    vlans {
        /Common/external
    }
    vlans-enabled
}
ltm virtual /Common/vs_shop_80 {
    destination /Common/160.19.5.20:80
    ip-protocol tcp
    mask 255.255.255.255
    policies {
        /Common/policy_http_redirect { }
    }
    pool /Common/pool_shop
    profiles {
        /Common/http_shop { }
        /Common/tcp { }
    }
    source 0.0.0.0/0
    source-address-translation {
        type automap
    }
    vlans {
        /Common/external
    }
    vlans-enabled
}
ltm virtual-address /Common/160.19.5.20 {
    address 160.19.5.20
    mask 255.255.255.255
    traffic-group /Common/traffic-group-1
}
net route /Common/default {
    gw 203.0.113.1
    network default
}
net self /Common/self_ext {
    address 203.0.113.10/24
    allow-service none
    traffic-group /Common/traffic-group-local-only
    vlan /Common/external
}
net self /Common/self_ext_float {
    address 203.0.113.12/24
    allow-service none
    floating enabled
    traffic-group /Common/traffic-group-1
    vlan /Common/external
}
net self /Common/self_int {
    address 10.10.30.1/24
    allow-service none
    traffic-group /Common/traffic-group-local-only
    vlan /Common/internal
}
net self /Common/self_int_float {
    address 10.10.30.3/24
    allow-service none
    floating enabled
    traffic-group /Common/traffic-group-1
    vlan /Common/internal
}
net self /Common/self_ha {
    address 10.10.99.1/24
    allow-service {
        tcp:4353
        udp:1026
        tcp:1026
    }
    traffic-group /Common/traffic-group-local-only
    vlan /Common/ha
}
net trunk /Common/trk_uplink {
    interfaces {
        1.1
        1.2
    }
    lacp enabled
}
net vlan /Common/external {
    interfaces {
        trk_uplink {
            tagged
        }
    }
    tag 100
}
net vlan /Common/internal {
    interfaces {
        trk_uplink {
            tagged
        }
    }
    tag 200
}
net vlan /Common/ha {
    interfaces {
        1.3 { }
    }
    tag 300
}
sys file ssl-cert /Common/shop.example.com.crt {
    certificate-key-size 2048
    expiration-date 1863129600
    expiration-string "Jan 15 00:00:00 2029 GMT"
    issuer "CN=Corp Issuing CA,O=Corp Example"
    key-type rsa-private
    subject "CN=shop.example.com,O=Corp Example"
}
sys folder /Common {
    device-group /Common/dg_ha
    traffic-group /Common/traffic-group-1
}
sys global-settings {
    console-inactivity-timeout 900
    gui-setup disabled
    hostname lb-dc-01.corp.example.com
}
sys httpd {
    allow { 10.10.0.0/16 }
    auth-pam-idle-timeout 900
    ssl-protocol "all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1"
}
sys management-ip 10.10.0.5/24 { }
sys ntp {
    servers { 10.10.0.10 10.10.0.11 }
    timezone Asia/Jakarta
}
sys provision asm {
    level nominal
}
sys provision ltm {
    level nominal
}
sys snmp {
    agent-addresses { udp:161 }
    allowed-addresses { 10.10.0.0/16 }
    users {
        monitor {
            access ro
            auth-password-encrypted $M$ab$syntheticauth==
            auth-protocol sha
            privacy-password-encrypted $M$cd$syntheticpriv==
            privacy-protocol aes
            security-level auth-priv
        }
    }
    sys-contact "noc@corp.example.com"
}
sys sshd {
    allow { 10.10.0.0/16 }
    inactivity-timeout 900
}
sys syslog {
    remote-servers {
        siem {
            host 10.10.0.30
            remote-port 514
        }
    }
}
