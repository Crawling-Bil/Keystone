# SYNTHETIC vCMP host configuration for unit tests: names and addresses are invented; the layout follows tmsh 'list vcmp guest', 'list net vlan' and 'list net trunk'.
cm device /Common/vcmp-host-01.lab.example {
    configsync-ip none
    hostname vcmp-host-01.lab.example
    marketing-name "BIG-IP i5800"
    platform-id C119
    self-device true
    version 15.1.8.2
    management-ip 192.0.2.10
}
net trunk /Common/trk_uplink {
    interfaces {
        1.1
        1.2
    }
    lacp enabled
}
net vlan /Common/v_web_vip {
    interfaces {
        trk_uplink {
            tagged
        }
    }
    tag 100
}
net vlan /Common/v_web_real {
    interfaces {
        trk_uplink {
            tagged
        }
    }
    tag 101
}
net vlan /Common/v_app_vip {
    interfaces {
        1.3 {
            tagged
        }
    }
    tag 200
}
net vlan /Common/v_mgmt_sync {
    interfaces {
        1.4 {
            untagged
        }
    }
    tag 999
}
vcmp guest ltm-web-01 {
    allowed-slots { 1 }
    cores-per-slot 4
    hostname ltm-web-01.lab.example
    initial-image BIGIP-15.1.8.2-0.0.9.iso
    management-gw 192.0.2.1
    management-ip 192.0.2.21/24
    management-network bridged
    min-slots 1
    slots 1
    state deployed
    vlans {
        /Common/v_web_vip
        /Common/v_web_real
        /Common/v_mgmt_sync
    }
}
vcmp guest ltm-app-01 {
    allowed-slots { 1 }
    cores-per-slot 2
    hostname ltm-app-01.lab.example
    management-gw 192.0.2.1
    management-ip 192.0.2.22/24
    management-network bridged
    min-slots 1
    slots 1
    state provisioned
    vlans {
        /Common/v_app_vip
        /Common/v_mgmt_sync
    }
}
